[package]
name = "sha256-viz"
version = "0.2.1"
edition = "2024"
rust-version = "1.97"
authors = ["c1ph3rC4t"]
categories = ["visualization", "cryptography"]
description = "A SHA2-256 visualizer."
homepage = "https://github.com/c1ph3rC4t/sha256-viz"
keywords = ["sha256", "sha", "visualizer", "viz"]
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/c1ph3rC4t/sha256-viz"

[[bin]]
name = "sha256-viz"
path = "src/main.rs"

[dependencies]
thiserror = "2.0.20"

[dev-dependencies]
cargo-husky = { version = "1.5.0", default-features = true, features = [
    "user-hooks",
] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
perf = "warn"
unwrap_used = "warn"
expect_used = "warn"
redundant_type_annotations = "warn"
manual_rotate = { level = "allow", priority = 127 }

[profile.release]
opt-level = 3
debug = false
strip = "symbols"
debug-assertions = false
overflow-checks = false
lto = "fat"
panic = "unwind"
incremental = false
codegen-units = 1
rpath = false

[profile.min-size]
inherits = "release"
opt-level = "z"
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "abort"
